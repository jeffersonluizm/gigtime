# Publica a demonstração do GigTime no GitHub Pages.
# Só vai para o ar o que o site precisa: index.html (redireciona para a Home), 404.html e codigo-fonte/.
# Ativar uma vez: Settings > Pages > Build and deployment > Source: "GitHub Actions" (ver docs/deploy.md).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Montar a pasta do site
        env:
          URL_DO_SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp index.html 404.html _site/
          cp -r codigo-fonte _site/codigo-fonte
          # Metadados de compartilhamento (Open Graph) precisam do endereço absoluto do site publicado
          grep -rl "__URL_DO_SITE__" _site --include=*.html | xargs -r sed -i "s#__URL_DO_SITE__#${URL_DO_SITE}#g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
