<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigTime - Editar perfil</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="style_edit.css">
</head>

<body class="bg-gig">
    <!--Barra de navegação-->
    <nav class="navbar navbar-expand-sm fixed-top bg-gig-pr" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="../Home/home.html">
                <img src="../assets/img/logo-claro.svg" alt="" width="30" height="30" class="d-inline-block align-text-top">
                GigTime
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="navbar-nav ms-auto">
                    <!-- Container com os links customizados conforme status de login (logado ou deslogado) -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container text-center mt-6 pb-5">
        <!-- Pré-visualização do banner e da foto de perfil (vêm dos links abaixo) -->
        <div class="banner mx-auto">
            <span class="bannerimg w-100 h-100"><img id="bannerPreview" src="" alt="Banner" class="w-100 h-100 object-fit-cover"></span>
        </div>
        <div class="icon mx-auto mt-3">
            <span class="iconimg w-100 h-100"><img id="profilePreview" src="" alt="Foto de perfil" class="w-100 h-100 object-fit-cover"></span>
        </div>

        <form id="editForm" class="row g-3 mt-2 text-start" novalidate>
            <div class="col-sm-12 col-lg-6">
                <label for="profilePicLink" class="form-label">Foto de perfil (link)</label>
                <input type="text" class="form-control" id="profilePicLink" placeholder="Link da imagem. Vazio usa a foto padrão.">
            </div>
            <div class="col-sm-12 col-lg-6">
                <label for="bannerPicLink" class="form-label">Banner (link)</label>
                <input type="text" class="form-control" id="bannerPicLink" placeholder="Link da imagem do banner">
            </div>

            <div class="col-sm-12 col-lg-6">
                <label for="username" class="form-label">Nome de usuário</label>
                <input type="text" class="form-control" id="username" readonly aria-describedby="usernameAjuda">
                <div id="usernameAjuda" class="form-text">O nome de usuário não pode ser alterado.</div>
            </div>
            <div class="col-sm-12 col-lg-6">
                <label for="name" class="form-label">Nome</label>
                <input type="text" class="form-control" id="name" required>
                <div class="invalid-feedback" data-campo="name"></div>
            </div>

            <div class="col-sm-12 col-lg-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
                <div class="invalid-feedback" data-campo="email"></div>
            </div>
            <div class="col-sm-12 col-lg-6">
                <label for="phone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="phone" required>
                <div class="invalid-feedback" data-campo="phone"></div>
            </div>

            <div class="col-sm-12 col-lg-6">
                <label for="role" class="form-label">Perfil</label>
                <select id="role" class="form-select" required>
                    <option value="">Escolha seu perfil...</option>
                    <option value="Músico">Músico</option>
                    <option value="Contratante">Contratante</option>
                </select>
                <div class="invalid-feedback" data-campo="role"></div>
            </div>
            <div class="col-sm-12 col-lg-6">
                <label for="state" class="form-label">Estado</label>
                <select id="state" class="form-select" required>
                    <option value="">Escolha seu estado...</option>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="DF">DF</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MT">MT</option>
                    <option value="MS">MS</option>
                    <option value="MG">MG</option>
                    <option value="PA">PA</option>
                    <option value="PB">PB</option>
                    <option value="PR">PR</option>
                    <option value="PE">PE</option>
                    <option value="PI">PI</option>
                    <option value="RJ">RJ</option>
                    <option value="RN">RN</option>
                    <option value="RS">RS</option>
                    <option value="RO">RO</option>
                    <option value="RR">RR</option>
                    <option value="SC">SC</option>
                    <option value="SP">SP</option>
                    <option value="SE">SE</option>
                    <option value="TO">TO</option>
                </select>
                <div class="invalid-feedback" data-campo="state"></div>
            </div>

            <div class="col-sm-12 col-lg-6">
                <label for="city" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="city" required>
                <div class="invalid-feedback" data-campo="city"></div>
            </div>
            <div class="col-sm-12 col-lg-6">
                <label for="songLink" class="form-label">Vídeo autoral</label>
                <input type="text" class="form-control" id="songLink" placeholder="No Youtube, clique em 'Compartilhar' e cole o link aqui">
            </div>

            <div class="col-12">
                <span class="form-label d-block">Gêneros</span>
                <div id="genres">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="genreSertanejo" value="Sertanejo">
                        <label class="form-check-label" for="genreSertanejo">Sertanejo</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="genreRock" value="Rock">
                        <label class="form-check-label" for="genreRock">Rock</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="genreMPB" value="MPB">
                        <label class="form-check-label" for="genreMPB">MPB</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="genrePop" value="Pop">
                        <label class="form-check-label" for="genrePop">Pop</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="genreForró" value="Forró">
                        <label class="form-check-label" for="genreForró">Forró</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="genreJazz" value="Jazz">
                        <label class="form-check-label" for="genreJazz">Jazz</label>
                    </div>
                </div>
                <div class="invalid-feedback" data-campo="genres"></div>
            </div>

            <div class="col-sm-12 col-lg-6">
                <label for="senhaAtual" class="form-label">Senha atual (obrigatória para salvar)</label>
                <input type="password" class="form-control" id="senhaAtual" autocomplete="current-password" required>
                <div class="invalid-feedback" data-campo="senhaAtual"></div>
            </div>

            <div class="col-12 text-danger" role="alert" data-erro-formulario></div>
            <div class="col-12 text-center">
                <button type="button" class="btn btn-danger" id="clear_button">Desfazer alterações</button>
                <button type="submit" class="btn btn-primary" id="salvar_button">Salvar</button>
            </div>
        </form>
    </div>
    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../lib/html.js"></script>
    <script src="../lib/constantes.js"></script>
    <script src="../lib/armazenamento.js"></script>
    <script src="../lib/senha.js"></script>
    <script src="../lib/validacao.js"></script>
    <script src="../lib/perfil.js"></script>
    <script src="../lib/sessao.js"></script>
    <script src="../dados/usuarios-exemplo.js"></script>
    <script src="../inicializacao.js"></script>
    <script src="../ui/navbar.js"></script>
    <script src="app.js"></script>
</body>

</html>
