<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigTime - Registro</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="styleReg.css">
</head>
<body class="d-flex bg-light justify-content-center align-items-center min-vh-100">

  <!-- Tela de Registro -->
  <div class="card shadow mx-2 my-2 p-4 login-card">
    <h3 class="text-center mb-4">Registrar</h3>
    <div class="d-flex justify-content-center mb-3">
      <img id="profilePic" src="../userImages/defaultUser.jpg" alt="Foto de perfil" width="110" height="110" class="shadow object-fit-cover rounded-circle border border-2">
    </div>
    <form id="registerForm" novalidate>
      <!-- Foto de Perfil -->
      <div class="mb-3">
        <label for="profilePicLink" class="form-label">Foto de Perfil</label>
        <input type="url" class="form-control" id="profilePicLink" placeholder="https://... (opcional)">
        <div class="invalid-feedback" data-campo="profilePicLink"></div>
      </div>
      <!-- Nome de Usuário -->
      <div class="mb-3">
        <label for="username" class="form-label">Nome de Usuário</label>
        <input type="text" class="form-control" id="username" placeholder="Escolha um nome de usuário" required>
        <div class="invalid-feedback" data-campo="username"></div>
      </div>
      <!-- Nome -->
      <div class="mb-3">
        <label for="name" class="form-label">Nome</label>
        <input type="text" class="form-control" id="name" placeholder="Escreva seu nome" required>
        <div class="invalid-feedback" data-campo="name"></div>
      </div>
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
        <div class="invalid-feedback" data-campo="email"></div>
      </div>
      <!-- Telefone -->
      <div class="mb-3">
        <label for="phone" class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="phone" placeholder="Digite seu telefone" required>
        <div class="invalid-feedback" data-campo="phone"></div>
      </div>
      <!-- Seleção de Perfil -->
      <div class="mb-3">
        <label for="role" class="form-label">Perfil</label>
        <select id="role" class="form-select" required>
          <option value="" selected>Escolha seu perfil...</option>
          <option value="Músico">Músico</option>
          <option value="Contratante">Contratante</option>
        </select>
        <div class="invalid-feedback" data-campo="role"></div>
      </div>
      <!-- Gêneros músicas -->
      <div class="mb-3">
        <label for="genres" class="form-label">Gêneros</label>
        <div id="genres">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="genreSertanejo" value="Sertanejo">
            <label class="form-check-label" for="genreSertanejo">Sertanejo</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="genreRock" value="Rock">
            <label class="form-check-label" for="genreRock">Rock</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="genreMPB" value="MPB">
            <label class="form-check-label" for="genreMPB">MPB</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="genrePop" value="Pop">
            <label class="form-check-label" for="genrePop">Pop</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="genreForró" value="Forró">
            <label class="form-check-label" for="genreForró">Forró</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="genreJazz" value="Jazz">
            <label class="form-check-label" for="genreJazz">Jazz</label>
          </div>
        </div>
        <div class="invalid-feedback" data-campo="genres"></div>
      </div>      
      <!-- Estado -->
      <div class="mb-3">
        <label for="state" class="form-label">Estado</label>
        <select id="state" class="form-select" required>
          <option value="" selected>Escolha seu estado...</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
        <div class="invalid-feedback" data-campo="state"></div>
      </div>
      <!-- Cidade -->
      <div class="mb-3">
        <label for="city" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="city" placeholder="Escreva sua cidade" required>
        <div class="invalid-feedback" data-campo="city"></div>
      </div>
      <!-- Link do vídeo -->
      <div class="mb-3">
        <label for="songLink" class="form-label">Vídeo autoral</label>
        <input type="text" class="form-control" id="songLink" placeholder="No Youtube, clique em 'Compartilhar' e cole o link aqui">
        <div class="invalid-feedback" data-campo="songLink"></div>
      </div>
      <!-- Senha -->
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input type="password" class="form-control" id="password" placeholder="Digite uma senha" required>
        <div class="invalid-feedback" data-campo="senha"></div>
      </div>
      <!-- Confirmação de Senha -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirme sua Senha</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirme sua senha" required>
        <div class="invalid-feedback" data-campo="confirmacao"></div>
      </div>
      <div class="text-danger mb-3" role="alert" data-erro-formulario></div>
      <!-- Botão de Registro -->
      <div class="d-grid">
        <button type="submit" class="btn btn-secondary bg-gig-pr text-white">Registrar</button>
      </div>
      <!-- Link para Login -->
      <div class="text-center mt-3">
        <a href="../Login/login.html" class="text-decoration-none text-gig-pr">Já tem uma conta? Login</a>
      </div>
    </form>
  </div>
  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../lib/html.js"></script>
  <script src="../lib/armazenamento.js"></script>
  <script src="../lib/senha.js"></script>
  <script src="../lib/validacao.js"></script>
  <script src="../lib/perfil.js"></script>
  <script src="../dados/usuarios-exemplo.js"></script>
  <script src="../global.js"></script>
  <script src="scriptRegistro.js"></script>
</body>
</html>
