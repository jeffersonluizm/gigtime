<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigTime - Perfil</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="stylePerfil.css">
</head>
  <body>
         <!--Barra de navegação-->
         <nav class="navbar navbar-expand-sm fixed-top bg-gig-pr" data-bs-theme="dark">
          <div class="container-fluid">
            <a class="navbar-brand" href="../Home/home.html">
              <img src="../assets/img/logo-claro.svg" alt="" width="30" height="30" class="d-inline-block align-text-top">
              GigTime
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <div class="navbar-nav ms-auto">
              
              </div>
            </div>
          </div>
        </nav>

    <div class="header__wrapper">
      <header><img id="bannerImg" src="" class="w-100"/></header>
      <div class="cols__container">
        <div class="left__col">
          <div class="img__container">
            <img id="profilePic" src="" alt="User Profile Picute" />
            <span></span>
          </div>
          <h2 id="name"></h2>

          <ul class="about">
            <li><span id="badges" class="badge"></span></li>
            <li><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#person"></use></svg><span id="role"></span></li>
            <li><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#envelope"></use></svg><span id="email"></span></li>
            <li><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#telephone"></use></svg><span id="phone"></span></li>
            <li><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#geo-alt"></use></svg><span id="location"></span></li>
            <li><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#music-note-beamed"></use></svg><span id="genres"></span></li>
          </ul>

          <div class="content">
            <iframe id="songLink"
              width="336" 
              height="189" 
              src="" 
              title="Video do YouTube" 
              frameborder="0" 
              allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" 
              referrerpolicy="strict-origin-when-cross-origin" 
              allowfullscreen>
            </iframe>
          </div>
        </div>
        <div class="right__col">
          <nav>
            <ul>
              <li><a href="">Destaques</a></li>
              <!-- <li><a href="">Albums</a></li> -->
            </ul>
            
            <button type="button" id="acaoPerfil">Contate-me</button>


          </nav>

          <div class="photos">
            <img id="img1" src="" alt="Foto Destaque 1" />
            <img id="img2" src="" alt="Foto Destaque 2" />
            <img id="img3" src="" alt="Foto Destaque 3" />
            <img id="img4" src="" alt="Foto Destaque 4" />
            <img id="img5" src="" alt="Foto Destaque 5" />
            <img id="img6" src="" alt="Foto Destaque 6" />
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
    <button class="close-btn" id="close-btn">&times;</button>
    <img id="modal-img" src="" alt="Imagem Ampliada">
    </div>
    
    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    
    <script src="../lib/html.js"></script>
    
    <script src="../lib/constantes.js"></script>
    
    <script src="../lib/armazenamento.js"></script>
    
    <script src="../lib/senha.js"></script>
    
    <script src="../lib/validacao.js"></script>
    
    <script src="../lib/perfil.js"></script>
    
    <script src="../lib/sessao.js"></script>
    
    <script src="../dados/usuarios-exemplo.js"></script>
    
    <script src="../inicializacao.js"></script>
    
    <script src="../ui/navbar.js"></script>
    
    <script src="perfil.js"></script>
  </body>
</html>
