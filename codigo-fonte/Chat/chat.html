<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigTime - Mensagens</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">

  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
   

        <nav class="navbar navbar-expand-sm fixed-top bg-gig-pr" data-bs-theme="dark">
            <div class="container-fluid">
            <a class="navbar-brand" href="../Home/home.html">
                <img src="../assets/img/logo-claro.svg" alt="" width="30" height="30" class="d-inline-block align-text-top">
                GigTime
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="navbar-nav ms-auto mb-2 mb-lg-0">
                </div>
            </div>
            </div>
        </nav>

    
    <div class="container">
        <div class="leftside">

            <div class="chatHeader">
                <ul class ="chatNavbar">
                    <li><a>Conversas</a></li>
                </ul>
            </div>

            <div class="chatlist" id="listaConversas">
                <!-- Preenchida pelo chat.js com as conversas do usuário logado -->
            </div>

        </div>

        <div class="rightside">

            <div class="chatHeader right">
                <div class ="imgtext">
                    <button type="button" class="voltar" id="voltarLista" title="Voltar para as conversas" aria-label="Voltar para as conversas"><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#arrow-left"></use></svg></button>
                    <div class="userImg">
                        <img id="fotoContato" src="../userImages/defaultUser.jpg" class="cover cover3" alt="">
                    </div>
                    <h4><span id="nomeContato" class="nomeContato">Mensagens</span><br><span id="detalheContato"></span></h4>
                </div>

                <ul class ="chatNavbar2">
                    <li><a id="verPerfilContato" href="#" title="Ver perfil" class="d-none"><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#person-circle"></use></svg></a></li>
                </ul>
            </div>

            <div class="chat" id="areaMensagens">
                <!-- Preenchida pelo chat.js com a conversa escolhida -->
            </div>

            <form class="chatInput" id="chatForm" autocomplete="off">
                <input type="text" id="mensagem" placeholder="Escreva aqui" aria-label="Mensagem" maxlength="2000" disabled>
                <button type="submit" class="enviar" id="enviar" title="Enviar" disabled><svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#send-fill"></use></svg></button>
            </form>

        </div>

    </div>

    <footer >

    <script src="../lib/senha.js"></script>
    <script src="../lib/mensagens.js"></script>
    <script src="../dados/usuarios-exemplo.js"></script>
    <script src="../global.js"></script>
    <script src="chat.js"></script>

</body>
</html>
