<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensagens | GigTime</title>
  <meta name="description" content="Converse com músicos e contratantes no GigTime para combinar data, repertório e cachê.">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="preload" href="../assets/fontes/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body data-pagina="mensagens" data-exige-login>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header id="topo"></header>

  <main id="conteudo" tabindex="-1">
    <div class="container py-3 py-lg-4">
      <h1 class="visually-hidden">Mensagens</h1>
      <div class="chat-app">
        <section class="chat-lista" aria-labelledby="tituloConversas">
          <div class="chat-cabecalho">
            <h2 class="h5 mb-0" id="tituloConversas">Conversas</h2>
          </div>
          <ul class="chatlist" id="listaConversas"></ul>
        </section>

        <section class="chat-conversa" aria-labelledby="nomeContato">
          <div class="chat-cabecalho">
            <button type="button" class="voltar" id="voltarLista" aria-label="Voltar para as conversas">
              <svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#arrow-left"></use></svg>
            </button>
            <img id="fotoContato" class="avatar" src="../assets/img/avatar-padrao.svg" alt="" width="40" height="40" data-fallback="avatar">
            <div class="chat-contato">
              <h2 class="h6 mb-0" id="nomeContato">Mensagens</h2>
              <span id="detalheContato" class="texto-suave small"></span>
            </div>
            <a id="verPerfilContato" href="../Perfil/perfil.html" class="btn btn-sm btn-gig-secundario ms-auto d-none">
              <svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#person-circle"></use></svg> Ver perfil
            </a>
          </div>

          <div class="chat" id="areaMensagens" tabindex="0" aria-label="Mensagens da conversa"></div>
          <p class="visually-hidden" id="anuncioChat" aria-live="polite"></p>

          <form class="chatInput" id="chatForm" autocomplete="off">
            <label for="mensagem" class="visually-hidden">Mensagem</label>
            <input type="text" id="mensagem" class="form-control" placeholder="Escreva uma mensagem" maxlength="2000" disabled>
            <button type="submit" class="btn btn-gig enviar" id="enviar" aria-label="Enviar mensagem" disabled>
              <svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#send-fill"></use></svg>
            </button>
          </form>
          <p class="erro-envio" id="erroEnvio" role="alert"></p>
        </section>
      </div>
    </div>
  </main>

  <footer id="rodape"></footer>

  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../lib/html.js"></script>
  <script src="../lib/constantes.js"></script>
  <script src="../lib/armazenamento.js"></script>
  <script src="../lib/senha.js"></script>
  <script src="../lib/validacao.js"></script>
  <script src="../lib/perfil.js"></script>
  <script src="../lib/sessao.js"></script>
  <script src="../lib/mensagens.js"></script>
  <script src="../dados/usuarios-exemplo.js"></script>
  <script src="../inicializacao.js"></script>
  <script src="../ui/avisos.js"></script>
  <script src="../ui/formularios.js"></script>
  <script src="../ui/cards.js"></script>
  <script src="../ui/layout.js"></script>
  <script src="chat.js"></script>
</body>
</html>
