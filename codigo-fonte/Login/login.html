<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigTime - Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="styleLogin.css">
</head>
<body class="d-flex bg-light justify-content-center align-items-center min-vh-100">

  <!-- Tela de Login -->
  <div class="card shadow mx-2 mb-5 p-4 login-card">
    <h3 class="text-center mb-4">Login</h3>
    <form id="loginForm" novalidate>
      <!-- Campo de usuário -->
      <div class="mb-3">
        <label for="username" class="form-label">Usuário</label>
        <input 
          type="username" 
          class="form-control" 
          id="username" 
          placeholder="Digite seu usuário" 
          required>
        <div class="invalid-feedback">
          Por favor, insira um usuário válido.
        </div>
      </div>
      
      <!-- Campo de Senha -->
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          placeholder="Digite sua senha" 
          required>
        <div class="invalid-feedback">
          Por favor, insira sua senha.
        </div>
      </div>
      
      <!-- Botão de Login -->
      <div class="d-grid">
        <button type="submit" class="btn bg-gig-pr text-white">Entrar</button>
      </div>
      
      <!-- Link para Registro -->
      <div class="text-center mt-3">
        <a href="../Registro/registro.html" class="text-decoration-none text-gig-pr">Registrar-se</a>
      </div>
    </form>
  </div>
  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../lib/html.js"></script>
  <script src="../lib/armazenamento.js"></script>
  <script src="../lib/senha.js"></script>
  <script src="../dados/usuarios-exemplo.js"></script>
  <script src="../global.js"></script>
  <script src="scriptLogin.js"></script>
</body>
</html>
