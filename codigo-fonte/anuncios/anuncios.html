<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar músicos e contratantes | GigTime</title>
  <meta name="description" content="Encontre músicos e contratantes de música ao vivo por gênero, estado e avaliação.">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="preload" href="../assets/fontes/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="anuncios.css">
</head>
<body data-pagina="explorar">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header id="topo"></header>

  <main id="conteudo" tabindex="-1">
    <div class="container py-4 py-lg-5">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
          <span class="sobretitulo">Explorar</span>
          <h1 class="h2 mb-1">Músicos e contratantes</h1>
          <p class="texto-suave mb-0" id="resumoResultados" role="status" aria-live="polite"></p>
        </div>
        <button class="btn btn-gig-secundario d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#filtros" aria-expanded="false" aria-controls="filtros">
          <svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#funnel"></use></svg> Filtros
        </button>
      </div>

      <div class="row g-4">
        <div class="col-lg-3">
          <form id="filtros" class="painel filtros collapse d-lg-block" role="search" aria-label="Filtrar perfis">
            <div class="mb-3">
              <label for="busca" class="form-label">Buscar</label>
              <input type="search" class="form-control" id="busca" placeholder="Nome ou cidade" maxlength="80" autocomplete="off">
            </div>

            <fieldset class="mb-3">
              <legend class="form-label fs-6">Perfil</legend>
              <div class="grupo-papel">
                <input type="radio" class="btn-check" name="papel" id="radioTodos" value="" checked>
                <label class="btn btn-sm btn-gig-secundario" for="radioTodos">Todos</label>
                <input type="radio" class="btn-check" name="papel" id="radioMusician" value="Músico">
                <label class="btn btn-sm btn-gig-secundario" for="radioMusician">Músicos</label>
                <input type="radio" class="btn-check" name="papel" id="radioContractor" value="Contratante">
                <label class="btn btn-sm btn-gig-secundario" for="radioContractor">Contratantes</label>
              </div>
            </fieldset>

            <div class="mb-3">
              <label for="state" class="form-label">Estado</label>
              <select id="state" class="form-select"></select>
            </div>

            <fieldset class="mb-3">
              <legend class="form-label fs-6">Avaliação mínima</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="nota" id="avaliacao0" value="0" checked>
                <label class="form-check-label" for="avaliacao0">Qualquer</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="nota" id="avaliacao3" value="3">
                <label class="form-check-label" for="avaliacao3">3+</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="nota" id="avaliacao4" value="4">
                <label class="form-check-label" for="avaliacao4">4+</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="nota" id="avaliacao5" value="5">
                <label class="form-check-label" for="avaliacao5">5</label>
              </div>
            </fieldset>

            <fieldset class="mb-3">
              <legend class="form-label fs-6">Gêneros</legend>
              <div id="generos"></div>
            </fieldset>

            <button type="button" class="btn btn-sm btn-gig-secundario w-100" id="limparFiltros">
              <svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#arrow-counterclockwise"></use></svg> Limpar filtros
            </button>
          </form>
        </div>

        <div class="col-lg-9 resultados">
          <h2 class="visually-hidden">Resultados</h2>
          <div id="anuncios" class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4" aria-busy="true">
            <p class="estado carregando w-100">Carregando perfis</p>
          </div>
          <div class="text-center mt-4">
            <button type="button" class="btn btn-gig-secundario" id="mostrarMais" hidden>Mostrar mais perfis</button>
          </div>
          <div id="semResultados" class="estado painel" hidden>
            <svg class="icone" aria-hidden="true" focusable="false"><use href="../assets/icones.svg#search"></use></svg>
            <h2>Nenhum perfil com esses filtros</h2>
            <p class="mb-2">Tente outro estado, menos gêneros ou uma avaliação mínima menor.</p>
            <button type="button" class="btn btn-gig btn-sm" id="limparFiltrosVazio">Limpar filtros</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="rodape"></footer>

  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../lib/html.js"></script>
  <script src="../lib/constantes.js"></script>
  <script src="../lib/armazenamento.js"></script>
  <script src="../lib/senha.js"></script>
  <script src="../lib/validacao.js"></script>
  <script src="../lib/perfil.js"></script>
  <script src="../lib/sessao.js"></script>
  <script src="../lib/mensagens.js"></script>
  <script src="../dados/usuarios-exemplo.js"></script>
  <script src="../dados/demo.js"></script>
  <script src="../inicializacao.js"></script>
  <script src="../ui/avisos.js"></script>
  <script src="../ui/formularios.js"></script>
  <script src="../ui/cards.js"></script>
  <script src="../ui/layout.js"></script>
  <script src="../lib/filtros.js"></script>
  <script src="anuncios.js"></script>
</body>
</html>
